services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kitchen -d kitchen
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrator:
    build:
      context: .
      target: migrator
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    command:
      - up
    depends_on:
      postgres:
        condition: service_healthy

  kitchen:
    build:
      context: .
      target: service
      args:
        SERVICE: kitchen
    environment:
      KITCHEN_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable
      OPENAPI_PATH: /api/openapi.yaml
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://localhost:8080/readyz
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  restaurant:
    build:
      context: .
      target: service
      args:
        SERVICE: restaurant
    environment:
      RESTAURANT_HTTP_ADDR: ":8081"
      KITCHEN_BASE_URL: http://kitchen:8080
      RESTAURANT_API_KEY: demo-restaurant-key
      RESTAURANT_POLL_INTERVAL: 30s
      RESTAURANT_MIN_ORDER_AGE: 20s
      RESTAURANT_MAX_ORDER_KOPECKS: "500000"
    ports:
      - "8081:8081"
    depends_on:
      kitchen:
        condition: service_healthy

volumes:
  postgres_data:
